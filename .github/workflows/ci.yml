# this_file: .github/workflows/ci.yml
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: ./test.sh
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
